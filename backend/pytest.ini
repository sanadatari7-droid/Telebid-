[pytest]
testpaths = tests
asyncio_mode = auto
# The DB connection pool is created once per test session (see
# conftest.py's _test_database fixture) and asyncpg pools/connections are
# bound to the event loop they were created on — so every async fixture
# and test function must share that SAME loop, or pool.acquire() hangs
# forever waiting on a connection tied to a different loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
